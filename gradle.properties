# Project-wide Gradle settings.

# Increase JVM heap for faster builds on larger projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build caching — speeds up incremental builds
org.gradle.caching=true

# Enable configuration caching (Gradle 8+)
org.gradle.configuration-cache=true

# AndroidX — required. Do not change.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Machine-specific overrides (JDK path, aapt2, sdk.dir) belong in
# ~/.gradle/gradle.properties or local.properties — never commit them here.
# AGP 8.x requires JDK 17+: set JAVA_HOME in your environment instead.
