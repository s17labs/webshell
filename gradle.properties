# custom aapt2 execute location
android.aapt2FromMavenOverride=/usr/bin/aapt2

android.enableJetifier=true


# Project-wide Gradle settings.

# Increase JVM heap for faster builds on larger projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build caching — speeds up incremental builds
org.gradle.caching=true

# Enable configuration caching (Gradle 8+)
org.gradle.configuration-cache=true

# AndroidX — required. Do not change.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Use Java 17 for Gradle
org.gradle.java.home=/opt/java/jdk-17.0.18+8
